name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Passing no script_dirs makes the reusable workflow auto-discover *.sh files and
  # extensionless files with a shell shebang. Naming a directory instead would send every
  # file under it to shellcheck, including non-shell helpers such as the Python JWT signer.
  shellcheck:
    uses: nullplatform/actions-nullplatform/.github/workflows/shellcheck.yml@main
